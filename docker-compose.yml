# MailCheckr local / single-host deployment.
# Copy .env.example to .env and fill in real values before first run.
# Deep SMTP stays disabled unless SMTP_DEEP_ENABLED=true AND the Phase 0 gate has
# passed on the actual host network (see docs/phase-0-audit.md).
name: mailcheckr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailcheckr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mailcheckr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailcheckr} -d ${POSTGRES_DB:-mailcheckr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailcheckr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mailcheckr}
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      API_PORT: "4000"
      # Resource protection (docs/api.md "Limits") — explicit so a stray
      # .env cannot silently raise them on this host.
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      RATE_LIMIT_VERIFY_PER_DAY: "${RATE_LIMIT_VERIFY_PER_DAY:-50000}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-5242880}"
      MAX_CSV_ROWS: "${MAX_CSV_ROWS:-10000}"
      MAX_BATCH_JSON_EMAILS: "${MAX_BATCH_JSON_EMAILS:-1000}"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailcheckr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mailcheckr}
      REDIS_URL: redis://redis:6379
      # Deep SMTP gate (PRD §6): both stay false until the Phase-0 audit's
      # gate passes on this host's real network with provider approval.
      SMTP_DEEP_ENABLED: "${SMTP_DEEP_ENABLED:-false}"
      SMTP_EGRESS_APPROVED: "${SMTP_EGRESS_APPROVED:-false}"
      # Resource protection for job processing.
      WORKER_MAX_ATTEMPTS: "${WORKER_MAX_ATTEMPTS:-3}"
      PER_DOMAIN_CONCURRENCY: "${PER_DOMAIN_CONCURRENCY:-2}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-10}"
      MAX_CSV_ROWS: "${MAX_CSV_ROWS:-10000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published ports: the worker only makes outbound DNS (and, when the
    # gate passes, TCP/25) connections.

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
